[package]
name = "achainsaw-py"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Published to PyPI as the `achainsaw` wheel (pyproject.toml), not to crates.io.
publish = false

[lib]
name = "achainsaw"
crate-type = ["cdylib", "rlib"]
test = false

[features]
# Optional LLVM backend (`--backend llvm`); needs LLVM 22 (set LLVM_SYS_221_PREFIX).
llvm = ["achainsaw-codegen/llvm"]

[dependencies]
achainsaw-ir = { workspace = true }
achainsaw-codegen = { workspace = true }
pyo3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
