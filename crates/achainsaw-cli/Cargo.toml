[package]
name = "achainsaw"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A compiler for the code AI agents write: a flat SSA language with JSON diagnostics, compiled to sandboxed native code, with an MCP server"
readme = "../../README.md"
keywords = ["compiler", "mcp", "jit", "ai-agents", "llm"]
categories = ["compilers", "command-line-utilities", "development-tools"]

[[bin]]
name = "achainsaw"
path = "src/main.rs"

[features]
# Optional LLVM backend (`--backend llvm`); needs LLVM 22 (set LLVM_SYS_221_PREFIX).
llvm = ["achainsaw-codegen/llvm"]

[dependencies]
achainsaw-ir = { workspace = true }
achainsaw-codegen = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
