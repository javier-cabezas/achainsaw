[package]
name = "achainsaw"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "achainsaw"
path = "src/main.rs"

[features]
# Optional LLVM backend (`--backend llvm`); needs LLVM 22 (set LLVM_SYS_221_PREFIX).
llvm = ["achainsaw-codegen/llvm"]

[dependencies]
achainsaw-ir = { path = "../achainsaw-ir" }
achainsaw-codegen = { path = "../achainsaw-codegen" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
