[package]
name = "achainsaw-codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native code generation for achainsaw's AIR: a Cranelift JIT and AOT backend, the sandbox and the parallel runtime"
readme = "README.md"
keywords = ["compiler", "jit", "cranelift", "simd", "ai-agents"]
categories = ["compilers"]

[features]
# Optional LLVM backend (`Backend::Llvm`); needs LLVM 22 (set LLVM_SYS_221_PREFIX).
llvm = ["dep:achainsaw-llvm", "achainsaw-llvm/llvm"]

[dependencies]
achainsaw-ir = { workspace = true }
achainsaw-llvm = { workspace = true, optional = true }
cranelift-codegen = { workspace = true }
cranelift-frontend = { workspace = true }
cranelift-module = { workspace = true }
cranelift-jit = { workspace = true }
cranelift-native = { workspace = true }
cranelift-object = { workspace = true }
object = { workspace = true }
target-lexicon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
libloading = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# Both backends so tests can validate ISA settings for x86_64 and aarch64 on any host.
cranelift-codegen = { workspace = true, features = ["x86", "arm64"] }
# Independent f16/bf16 reference for conversion tests.
half = "2"

[lints]
workspace = true

