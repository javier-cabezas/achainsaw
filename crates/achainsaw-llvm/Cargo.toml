[package]
name = "achainsaw-llvm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Optional LLVM 22 backend for achainsaw's AIR (JIT and AOT), enabled by its `llvm` feature"
readme = "README.md"
keywords = ["compiler", "jit", "llvm", "simd", "ai-agents"]
categories = ["compilers"]

[features]
# Without this feature the crate is empty, so the workspace builds without LLVM installed.
llvm = ["dep:inkwell"]

[dependencies]
achainsaw-ir = { workspace = true }
anyhow = { workspace = true }
inkwell = { version = "0.11", features = ["llvm22-1-prefer-dynamic"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
