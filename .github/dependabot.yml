version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 10
    # Cranelift releases change its instruction lowering and ISLE rules, which the
    # backend's performance and exact results depend on: it is updated by hand.
    ignore:
      - dependency-name: "cranelift-*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 10
