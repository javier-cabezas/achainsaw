name: Release

# On a version tag (v*): builds the CLI binaries, the Python wheels and the source package,
# installs and runs each one on a fresh runner, then publishes them: a GitHub release with
# every artifact, the wheels and source package to PyPI (trusted publishing, the `pypi`
# environment), and the crates to crates.io (the CARGO_REGISTRY_TOKEN secret). The tag must
# name the workspace's version (v0.1.0 for 0.1.0). Run it by hand (workflow_dispatch) to
# build and test everything without publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: achainsaw-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: achainsaw-linux-x86_64-musl.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: achainsaw-linux-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: achainsaw-windows-x86_64.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: achainsaw-macos-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: achainsaw-macos-aarch64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --bin achainsaw --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/achainsaw package/
          cp README.md LICENSE package/
          tar -czvf ${{ matrix.archive }} -C package .
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Copy-Item target/${{ matrix.target }}/release/achainsaw.exe package/
          Copy-Item README.md, LICENSE package/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.archive }}
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.archive }}).Hash.ToLower()
          "$hash  ${{ matrix.archive }}" | Out-File -Encoding ascii "${{ matrix.archive }}.sha256"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  build-wheels:
    name: Build Python wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One abi3 wheel per platform serves Python 3.11 and later.
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: universal2-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel via maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build Python source package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build source package via maturin
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Check the source package's contents
        run: |
          tar -tzf dist/*.tar.gz > contents.txt
          wc -l contents.txt
          ls -l dist
          # The crates and the standard library, without the llama.cpp submodule.
          grep -q 'crates/achainsaw-ir/std/std.air' contents.txt
          ! grep -q 'third_party/' contents.txt

      - name: Upload source package
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  smoke-test:
    name: Smoke test (${{ matrix.os }})
    needs: [build-cli, build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cli: cli-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            cli: cli-aarch64-unknown-linux-gnu
          - os: windows-latest
            cli: cli-x86_64-pc-windows-msvc
          - os: macos-latest
            cli: cli-aarch64-apple-darwin

    steps:
      - name: Checkout repository (for the examples)
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download the wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true

      - name: Download this platform's CLI
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.cli }}
          path: cli

      - name: Install the wheel and run a kernel
        shell: bash
        run: |
          python -m pip install --no-index --find-links wheels achainsaw
          cd "$RUNNER_TEMP"
          python -c "
          import achainsaw
          k = achainsaw.compile('fn sq(x:i64)->i64\n  b0:\n    y = mul x, x\n    ret y\n')
          assert k.run('sq', 7) == 49, 'wrong result'
          print('achainsaw', achainsaw.version(), achainsaw.available_backends())
          "

      - name: Run the CLI on an example
        shell: bash
        run: |
          cd cli
          if [ -f *.zip ]; then unzip -q *.zip; else tar -xzf *.tar.gz; fi
          ./achainsaw --version
          ./achainsaw run ../examples/agent/sum_squares.air --func sum_squares --args 10

  check-version:
    name: Check the tag against the version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compare the tag with Cargo.toml and pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          py_v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "tag $tag, Cargo.toml $cargo_v, pyproject.toml $py_v"
          [ "$tag" = "$cargo_v" ] && [ "$tag" = "$py_v" ]

  publish-release:
    name: Publish GitHub release
    needs: [smoke-test, build-sdist, check-version]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-pypi:
    name: Publish to PyPI
    needs: [smoke-test, build-sdist, check-version]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # PyPI trusts this repository's release.yml in the `pypi` environment (no token).
    environment:
      name: pypi
      url: https://pypi.org/p/achainsaw
    permissions:
      id-token: write
    steps:
      - name: Download the wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download the source package
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    name: Publish to crates.io
    needs: [smoke-test, check-version]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # achainsaw-ir, achainsaw-llvm, achainsaw-codegen, then achainsaw (the CLI), each once
      # the crates it needs are on the index; achainsaw-py ships as the wheel.
      - name: Publish the crates
        run: cargo publish --workspace --exclude achainsaw-py --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
