name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: achainsaw-linux-x86_64.tar.gz
            bin_path: target/x86_64-unknown-linux-gnu/release/achainsaw
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: achainsaw-linux-x86_64-musl.tar.gz
            bin_path: target/x86_64-unknown-linux-musl/release/achainsaw
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: achainsaw-windows-x86_64.zip
            bin_path: target/x86_64-pc-windows-msvc/release/achainsaw.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: achainsaw-macos-x86_64.tar.gz
            bin_path: target/x86_64-apple-darwin/release/achainsaw
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: achainsaw-macos-aarch64.tar.gz
            bin_path: target/aarch64-apple-darwin/release/achainsaw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --bin achainsaw --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp ${{ matrix.bin_path }} package/
          cp README.md package/
          tar -czvf ${{ matrix.artifact_name }} -C package .
          sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          Copy-Item ${{ matrix.bin_path }} package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.artifact_name }}
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.artifact_name }}).Hash.ToLower()
          "$hash  ${{ matrix.artifact_name }}" | Out-File -Encoding ascii "${{ matrix.artifact_name }}.sha256"

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  build-wheels:
    name: Build Python Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: universal2-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels via Maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  publish-release:
    name: Publish GitHub Release
    needs: [build-cli, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
