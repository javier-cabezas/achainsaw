name: A program fails
description: An AIR program gives wrong results, crashes, or is rejected when it shouldn't be
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The wrong output, crash or diagnostic, and what you expected.
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: Program
      description: The smallest AIR program that shows it.
      render: text
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: How you ran it (`achainsaw run ...`, the MCP `air_run` arguments, or Python), and the backend.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The output of `achainsaw cpu`, your OS, and the achainsaw commit.
      render: json
    validations:
      required: true
