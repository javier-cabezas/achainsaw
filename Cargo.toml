[workspace]
members = [
    "crates/achainsaw-ir",
    "crates/achainsaw-codegen",
    "crates/achainsaw-cli",
    "crates/achainsaw-py",
    "crates/achainsaw-llvm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Javier Cabezas <8437757+javier-cabezas@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/javier-cabezas/achainsaw"
homepage = "https://github.com/javier-cabezas/achainsaw"

[workspace.dependencies]
# The workspace's own crates, with the version crates.io needs alongside the path.
achainsaw-ir = { path = "crates/achainsaw-ir", version = "0.1.0" }
achainsaw-codegen = { path = "crates/achainsaw-codegen", version = "0.1.0" }
achainsaw-llvm = { path = "crates/achainsaw-llvm", version = "0.1.0" }
cranelift-codegen = "0.136.2"
cranelift-frontend = "0.136.2"
cranelift-module = "0.136.2"
cranelift-jit = "0.136.2"
cranelift-native = "0.136.2"
cranelift-object = "0.136.2"
object = "0.40"
target-lexicon = "0.13.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
libloading = "0.9"
libc = "0.2"

[workspace.lints.rust]
unexpected_cfgs = "allow"
suspicious_runtime_symbol_definitions = "allow"

[workspace.lints.clippy]
result_large_err = "allow"
missing_safety_doc = "allow"
useless_conversion = "allow"

